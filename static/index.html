<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG 知识库问答系统</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0f1117; --surface: #1a1b26; --border: #2a2b3d;
    --text: #c0caf5; --text-dim: #565f89; --accent: #7aa2f7;
    --accent2: #bb9af7; --green: #9ece6a; --red: #f7768e;
  }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 18px; font-weight: 600; }
  header .tag { font-size: 11px; background: var(--accent); color: #000; padding: 2px 8px; border-radius: 10px; }
  .controls { display: flex; gap: 8px; align-items: center; }
  .controls label { font-size: 12px; color: var(--text-dim); }
  .controls select, .controls button { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  .controls button:hover { border-color: var(--accent); }
  #chat { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.7; font-size: 14px; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #1a1b3d; border: 1px solid var(--accent); }
  .msg.bot { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); }
  .msg.bot code { background: #13141f; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
  .msg.bot pre { background: #13141f; padding: 10px; border-radius: 6px; overflow-x: auto; margin: 8px 0; }
  .sources { margin-top: 8px; font-size: 12px; color: var(--text-dim); }
  .sources summary { cursor: pointer; color: var(--accent); }
  .sources .src-item { padding: 6px 0; border-top: 1px solid var(--border); margin-top: 4px; }
  .input-bar { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 10px; }
  .input-bar input { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; color: var(--text); font-size: 14px; outline: none; }
  .input-bar input:focus { border-color: var(--accent); }
  .input-bar button { background: var(--accent); color: #000; border: none; border-radius: 8px; padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .input-bar button:disabled { opacity: 0.5; cursor: not-allowed; }
  .preview-bar { display: flex; gap: 8px; padding: 8px 24px 0; flex-wrap: wrap; }
  .preview-item { position: relative; width: 64px; height: 64px; }
  .preview-item img { width: 64px; height: 64px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); }
  .preview-item .remove { position: absolute; top: -4px; right: -4px; background: var(--red); color: #fff; border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .upload-btn { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 18px; cursor: pointer; }
  .upload-btn:hover { border-color: var(--accent); }
  .typing { display: inline-block; width: 6px; height: 6px; background: var(--accent); border-radius: 50%; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:10px">
    <h1>RAG 知识库问答系统</h1>
    <span class="tag">v3.0</span>
  </div>
  <div class="controls">
    <label>模式</label>
    <select id="mode">
      <option value="normal">普通问答</option>
      <option value="stream" selected>流式输出</option>
      <option value="json">JSON 结构化</option>
    </select>
    <button onclick="loadStats()">状态</button>
  </div>
</header>

<div id="chat"></div>

<div id="preview-bar" class="preview-bar"></div>
<div class="input-bar">
  <button class="upload-btn" onclick="document.getElementById('fileInput').click()" title="上传图片">&#128247;</button>
  <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" multiple hidden />
  <input id="query" placeholder="输入你的问题…" autofocus />
  <button id="send" onclick="send()">发送</button>
</div>

<script>
const chat = document.getElementById('chat');
const queryInput = document.getElementById('query');
const sendBtn = document.getElementById('send');
const modeSelect = document.getElementById('mode');
const MAX_HISTORY = 10;
let history = [];
let pendingImages = [];

const fileInput = document.getElementById('fileInput');
fileInput.addEventListener('change', e => {
  for (const file of e.target.files) {
    if (pendingImages.length >= 3) { alert('最多上传 3 张图片'); break; }
    if (file.size > 4 * 1024 * 1024) { alert(file.name + ' 超过 4MB 限制'); continue; }
    const reader = new FileReader();
    reader.onload = ev => {
      pendingImages.push({ base64: ev.target.result, name: file.name });
      renderPreviews();
    };
    reader.readAsDataURL(file);
  }
  fileInput.value = '';
});

function renderPreviews() {
  const bar = document.getElementById('preview-bar');
  bar.innerHTML = pendingImages.map((img, i) =>
    '<div class="preview-item"><img src="' + img.base64 + '" /><button class="remove" onclick="removeImage(' + i + ')">×</button></div>'
  ).join('');
}

function removeImage(idx) {
  pendingImages.splice(idx, 1);
  renderPreviews();
}

queryInput.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

function addMsg(role, text, sources) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  if (sources && sources.length) {
    const det = document.createElement('details');
    det.className = 'sources';
    det.innerHTML = '<summary>参考来源 (' + sources.length + ')</summary>' +
      sources.map((s, i) => '<div class="src-item"><b>来源 ' + (i+1) + '</b> (score: ' + (s.score||0).toFixed(4) + ')<br>' + s.text.substring(0, 300) + '</div>').join('');
    div.appendChild(det);
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function send() {
  const q = queryInput.value.trim();
  if (!q) return;
  queryInput.value = '';
  sendBtn.disabled = true;

  addMsg('user', q);
  history.push({ role: 'user', content: q });
  if (history.length > MAX_HISTORY) history = history.slice(-MAX_HISTORY);

  const mode = modeSelect.value;
  const images = pendingImages.map(img => img.base64);
  const body = { question: q, top_k: 3, history, use_reranker: true, images };
  pendingImages = [];
  renderPreviews();

  try {
    if (mode === 'stream') {
      await streamAsk(body);
    } else if (mode === 'json') {
      await jsonAsk(body);
    } else {
      await normalAsk(body);
    }
  } catch (err) {
    addMsg('bot', 'Error: ' + err.message);
  }

  sendBtn.disabled = false;
  queryInput.focus();
}

async function normalAsk(body) {
  const res = await fetch('/api/ask', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  if (!res.ok) throw new Error('Server error: ' + res.status);
  const data = await res.json();
  addMsg('bot', data.answer, (data.contexts||[]).map((c,i) => ({text:c, score:data.scores?.[i]})));
  history.push({ role: 'assistant', content: data.answer });
}

async function jsonAsk(body) {
  const res = await fetch('/api/ask/json', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  if (!res.ok) throw new Error('Server error: ' + res.status);
  const data = await res.json();
  const text = data.answer + '\n\n置信度: ' + (data.confidence*100).toFixed(0) + '%\n要点: ' + (data.key_points||[]).join('; ');
  addMsg('bot', text);
  history.push({ role: 'assistant', content: data.answer });
}

async function streamAsk(body) {
  const res = await fetch('/api/ask/stream', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  if (!res.ok) throw new Error('Server error: ' + res.status);
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  const botDiv = addMsg('bot', '');
  let fullText = '';
  let buffer = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const parts = buffer.split('\n\n');
    buffer = parts.pop();
    for (const part of parts) {
      for (const line of part.split('\n')) {
        if (!line.startsWith('data: ')) continue;
        try {
          const evt = JSON.parse(line.slice(6));
          if (evt.token) { fullText += evt.token; botDiv.textContent = fullText; chat.scrollTop = chat.scrollHeight; }
          if (evt.done) { history.push({ role: 'assistant', content: fullText }); }
        } catch {}
      }
    }
  }
}

async function loadStats() {
  const res = await fetch('/api/stats');
  const d = await res.json();
  alert('知识库片段: ' + d.total_chunks + '\nEmbedding: ' + d.embed_model + '\nReranker: ' + d.reranker_model + '\n权重: vector=' + d.vector_weight + ' bm25=' + d.bm25_weight);
}
</script>
</body>
</html>
